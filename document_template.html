<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <!-- In production, n8n will replace this placeholder with the actual inline CSS from colors_and_type.css
       so PDFShift doesn't need external access to the CSS file. -->
  <style>
    {{CSS_CONTENT}}

    /* ===== PAGED MEDIA =====
       Trick: the @page background is void (black). Body background is paper.
       The body covers the page area; the margins remain visible as a black
       strip top + bottom. The @page margin-boxes are then placed inside that
       strip — running header (top, pages 2+) and running footer (every page).
       This gives us the full-bleed black header/footer bars from the
       SINE-SINE invoice without per-page HTML sectioning. */
    @page {
      size: A4 portrait;
      /* 32mm margin on top and bottom. The void header/footer bars are
         rendered as position:fixed HTML elements (see .bar rules below)
         — Chrome's print engine repeats them on every page. This avoids
         both the @page bg-image gradient/SVG approaches (which PDFShift
         silently ignores) AND the multi-margin-box anti-aliasing seam.
         The @page margins provide the empty space the bars sit in plus
         the 10mm paper spacer between bar and body content. */
      margin: 32mm 0 32mm 0;
      background-color: var(--paper, #F5F1EA);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page :first {
      /* Page 1: no top margin so the hero touches the page edge.
         Bottom 32mm matches Pages 2+. */
      margin: 0 0 32mm 0;
      background-color: var(--paper, #F5F1EA);
    }

    /* ===== RUNNING BARS (position:fixed) =====
       Single continuous box per bar — no internal seams, no anti-aliasing
       hairlines. Chrome's print engine repeats fixed elements on every
       page at the fixed top/bottom coordinates.

       On Page 1, the .page.hero (z-index 2) overlays .bar-top (z-index 1),
       so the top bar is hidden behind the hero. The bottom bar is visible
       on every page including Page 1. */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      height: 22mm;
      background-color: #0A0A0A;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18mm;
      box-sizing: border-box;
      z-index: 1;
    }
    .bar-top    { top: 0; }
    .bar-bottom { bottom: 0; }

    /* Header bar text styling (top of pages 2+) */
    .bar-top .bar-left {
      font-family: var(--font-display, 'Inter Tight'), sans-serif;
      font-weight: 900;
      font-size: 10pt;
      color: var(--paper, #F5F1EA);
    }
    .bar-top .bar-right {
      font-family: var(--font-mono, 'JetBrains Mono'), monospace;
      font-weight: 500;
      font-size: 8pt;
      color: rgba(245, 241, 234, 0.72);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Footer bar text styling (bottom of every page) */
    .bar-bottom .bar-left,
    .bar-bottom .bar-right {
      font-family: var(--font-mono, 'JetBrains Mono'), monospace;
      font-weight: 500;
      font-size: 7pt;
      line-height: 1.45;
      color: rgba(245, 241, 234, 0.48);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .bar-bottom .bar-right {
      text-align: right;
      white-space: nowrap;
    }

    /* Page counter appended to footer-right. counter(page) and
       counter(pages) are CSS Paged Media values; they may or may not
       resolve in body-level pseudo-elements depending on the renderer.
       Worst case: this ::after produces an empty string and the footer
       just reads "PITCH · SONY XM6" without the page number. */
    .bar-bottom .bar-right::after {
      content: " · SEITE " counter(page) " / " counter(pages);
    }

    /* Hero on Page 1 must stack ABOVE the fixed top bar to hide it. */
    .page.hero {
      position: relative;
      z-index: 2;
    }

    /* Body covers the page-content area. Its background is paper, leaving
       the @page void background visible only in the top/bottom margin
       strips — i.e. the running header / footer bars. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper, #F5F1EA);
      color: var(--void, #0A0A0A);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      /* No bottom padding — @page margin-bottom (18mm) provides the footer
         clearance. A non-zero padding-bottom here was previously overflowing
         to a trailing empty page with only running header/footer. */
      padding: 12mm 18mm 0 18mm;
      box-sizing: border-box;
      position: relative;
      background-color: var(--night, #0A0A0A);
      color: var(--fg-1, #E6E6E6);
    }

    /* Compact dark hero at top of page 1. 60mm fits logo + eyebrow + title
       tightly without dead space. Body flows immediately after. */
    .page.hero {
      height: 60mm;
      min-height: 60mm;
    }

    .page.paper {
      background-color: var(--paper, #F5F1EA);
      color: var(--void, #0A0A0A);
      /* no min-height — paper page flows naturally based on content length */
    }

    /* Hero top row: logo on left, slate-meta on right. */
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-logo {
      width: 200px;
      flex-shrink: 0;
    }

    /* Slate metadata — a thin mono line in the hero with REC-dot + date + origin. */
    .slate-meta {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fg-3, #888);
      text-align: right;
      white-space: nowrap;
    }

    .slate-meta .rec-dot {
      color: var(--rec, #E10600);
      font-size: 12pt;
      line-height: 1;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Inject a complete <svg> into the .header-logo container. */
    .header-logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* The wordmark SVG references these classes via <text class="wm wm-fg">
       and <tspan class="wm-dot">. Defined here so the SVG renders. */
    .header-logo svg .wm {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 800;
      font-size: 60px;
      letter-spacing: -0.05em;
    }
    .header-logo svg .wm-fg {
      fill: var(--paper, #F5F1EA);
    }
    .header-logo svg .wm-dot {
      fill: var(--rec, #E10600);
    }

    /* ===== TYPOGRAPHY =====
       Universal brand layer: every H1 and every H2 gets a REC-red ending
       dot via ::after. Section counter (01 —, 02 — ...) prefixes each H2
       via ::before. The AI does not need to know about either — they are
       pure CSS additions to plain <h1> / <h2> tags. */

    .document-content {
      font-family: var(--font-body, 'Inter', sans-serif);
      counter-reset: section;
    }

    .document-content h1 {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 900;
      font-size: 28pt;
      line-height: 1;
      margin-bottom: 0;
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      word-spacing: 0.18em;
    }

    /* REC-red period anchoring the title. Mirrors the wordmark `.` */
    .document-content h1::after {
      content: ".";
      color: var(--rec, #E10600);
    }

    .document-content h2 {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 700;
      font-size: 20pt;
      margin-top: 36px;
      margin-bottom: 14px;
      color: var(--void, #0A0A0A);
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      word-spacing: 0.18em;
      counter-increment: section;
    }

    /* Section counter eyebrow above each H2 — '01 — VISION'.
       Uses ::before on a wrapping ::marker-like pseudo-block. */
    .document-content h2::before {
      content: counter(section, decimal-leading-zero) " — ";
      display: block;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-weight: 500;
      font-size: 9pt;
      color: var(--rec, #E10600);
      letter-spacing: 0.22em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* REC-red period at the end of every H2, same signature as H1. */
    .document-content h2::after {
      content: ".";
      color: var(--rec, #E10600);
    }

    /* When the AI wraps part of an H2 in <em>, that part renders italic
       Regular (Inter Regular) for the SINE-SINE mixed-weight feel:
       e.g. "BANK<em>verbindung</em>" → BANK + italic verbindung. */
    .document-content h2 em {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-style: italic;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--void);
    }

    /* When the AI uses <strong> inside an H2 — currently default-styled,
       but reserved so we can do "BANK<strong>verbindung</strong>" → all-caps
       + lowercase mix in a future iteration. */
    .document-content h2 strong {
      font-weight: 900;
    }

    /* Eyebrow above the hero H1 — mono, REC-red, wide tracking.
       Triggered when the AI title contains a colon: "BRIEFING: TAGESDREH"
       → eyebrow "BRIEFING", h1 "TAGESDREH". */
    .document-content .eyebrow {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-weight: 500;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: var(--tracking-eyebrow, 0.22em);
      color: var(--rec, #E10600);
      margin: 0 0 14px;
      display: block;
    }

    .document-content h3 {
      font-weight: 600;
      font-size: 14pt;
      margin-top: 24px;
      margin-bottom: 10px;
      color: var(--void);
    }

    .document-content p {
      font-size: 11pt;
      line-height: 1.55;
      margin-bottom: 14px;
      color: var(--fg-2);
    }

    .page.paper .document-content p {
      color: var(--gray-600, #444);
    }

    /* Inline bold + italic in body copy. */
    .page.paper .document-content strong {
      color: var(--void);
      font-weight: 700;
    }

    .page.paper .document-content em {
      color: var(--void);
      font-style: italic;
    }

    .document-content ul, .document-content ol {
      margin-bottom: 14px;
      padding-left: 24px;
      font-size: 11pt;
      line-height: 1.55;
      color: var(--gray-600, #444);
    }

    .document-content li {
      margin-bottom: 6px;
    }

    /* Custom bullet — REC-red disc, mirroring the SINE-SINE list style. */
    .document-content ul {
      list-style: none;
      padding-left: 0;
    }
    .document-content ul li {
      position: relative;
      padding-left: 18px;
    }
    .document-content ul li::before {
      content: "●";
      color: var(--rec, #E10600);
      position: absolute;
      left: 0;
      top: 0;
      font-size: 8pt;
      line-height: 1.9;
    }

    /* ===== PAGE-BREAK RULES =====
       Prevent orphan H2 (heading at bottom of page with paragraph thrown
       to next page). Three-line orphan/widow control on paragraphs. */
    .document-content h1,
    .document-content h2,
    .document-content h3 {
      break-after: avoid-page;
      page-break-after: avoid;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .document-content h2 + p,
    .document-content h3 + p {
      break-before: avoid-page;
      page-break-before: avoid;
    }
    .document-content p {
      orphans: 3;
      widows: 3;
    }
    .document-content ul,
    .document-content ol {
      break-inside: avoid-page;
      page-break-inside: avoid;
    }

  </style>
</head>
<body>
  <!-- Running header bar: position:fixed, appears on every page at the
       top edge. On Page 1 it is hidden behind the .page.hero (z-index). -->
  <div class="bar bar-top">
    <span class="bar-left">{{RUNNING_HEADER_LEFT}}</span>
    <span class="bar-right">{{RUNNING_HEADER_RIGHT}}</span>
  </div>

  <!-- Running footer bar: position:fixed, appears on every page at the
       bottom edge. Page counter is appended via CSS ::after. -->
  <div class="bar bar-bottom">
    <span class="bar-left">{{FOOTER_LEFT}}</span>
    <span class="bar-right">{{FOOTER_RIGHT}}</span>
  </div>

  <!-- Hero: compact dark band at top of page 1.
       Top row: logo (left) + slate-meta (right).
       Below: eyebrow + h1 from the AI's first <h1>. -->
  <div class="page hero">
    <div class="hero-top">
      <div class="header-logo">
        {{LOGO_SVG_CONTENT}}
      </div>
      <div class="slate-meta">
        {{SLATE_META}}
      </div>
    </div>
    <div class="document-content">
      {{HERO_CONTENT}}
    </div>
  </div>

  <!-- Body: paper-white, flows naturally. Multi-page bodies inherit paper
       background from body{} above. Continued pages get a top margin from
       @page (not :first), into which the running header is rendered. -->
  <div class="page paper">
    <div class="document-content">
      {{BODY_CONTENT}}
    </div>
  </div>
</body>
</html>
