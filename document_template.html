<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <!-- In production, n8n will replace this placeholder with the actual inline CSS from colors_and_type.css 
       so CloudConvert doesn't need external access to the CSS file. -->
  <style>
    {{CSS_CONTENT}}

    /* Print-specific overrides and A4 sizing for CloudConvert */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    
    /* Both html and body need paper bg — colors_and_type.css sets
       `html, body { background: var(--bg) }` (= void) which would otherwise
       reveal as a dark strip below the body's content on short docs. */
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper, #F5F1EA);
      color: var(--void, #0A0A0A);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      padding: 12mm 18mm 24mm 18mm;
      box-sizing: border-box;
      position: relative;
      background-color: var(--void);
      color: var(--fg-1, #E6E6E6);
    }

    /* Compact dark hero at top of page 1. 60mm fits logo + eyebrow + title
       tightly without dead space. Body flows immediately after. */
    .page.hero {
      height: 60mm;
      min-height: 60mm;
    }

    .page.paper {
      background-color: var(--paper, #FAFAFA);
      color: var(--void, #0A0A0A);
      /* no min-height — paper page flows naturally based on content length */
    }

    .header-logo {
      width: 200px;
      margin-bottom: 20px;
    }

    .header-logo.light {
      filter: invert(1);
    }

    /* Inject a complete <svg> into the .header-logo container.
       Scale to container width, preserve aspect ratio. */
    .header-logo svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* The wordmark SVG references these classes via <text class="wm wm-fg">
       and <tspan class="wm-dot">. They are NOT defined in colors_and_type.css
       (only in preview/components-nav.html). Define them here so the SVG renders. */
    .header-logo svg .wm {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 800;
      /* 60px in viewBox units fits the full "rec.sleep.repeat." text
         within the SVG's viewBox width of 640. 80px caused right-edge clipping. */
      font-size: 60px;
      letter-spacing: -0.05em;
    }
    .header-logo svg .wm-fg {
      fill: var(--paper, #F5F1EA);
    }
    .header-logo svg .wm-dot {
      fill: var(--rec, #E10600);
    }

    .document-content {
      /* Typography mappings */
      font-family: var(--font-body, 'Inter', sans-serif);
    }

    .document-content h1 {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 900;
      font-size: 28pt;
      line-height: 1;
      margin-bottom: 0;
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      /* Compensate for negative letter-spacing crushing the space glyph
         to ~0 width on UPPERCASE Inter Tight Black. */
      word-spacing: 0.18em;
    }

    .document-content h2 {
      font-family: var(--font-display, 'Inter Tight', sans-serif);
      font-weight: 700;
      font-size: 20pt;
      margin-top: 32px;
      margin-bottom: 16px;
      color: var(--rec, #FF0000);
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      word-spacing: 0.18em;
    }

    /* Eyebrow above the hero H1 — mono, REC-red, wide tracking.
       Used when the AI title contains a colon (e.g. "BRIEFING: TAGESDREH"
       becomes <p class="eyebrow">BRIEFING</p><h1>TAGESDREH</h1>). */
    .document-content .eyebrow {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-weight: 500;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: var(--tracking-eyebrow, 0.22em);
      color: var(--rec, #E10600);
      margin: 0 0 16px;
      display: block;
    }

    .document-content h3 {
      font-weight: 600;
      font-size: 14pt;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .document-content p {
      font-size: 11pt;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--fg-2);
    }
    
    .page.paper .document-content p {
      color: var(--gray-600);
    }

    .document-content ul, .document-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
      font-size: 11pt;
      line-height: 1.5;
    }
    
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 5mm 18mm;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 8pt;
      color: var(--fg-3);
      border-top: 1px solid var(--border);
    }

    .page.paper .footer {
      border-top: 1px solid var(--gray-200);
      color: var(--gray-400);
    }

  </style>
</head>
<body>
  <!-- Hero: compact dark band at top of page 1 with logo + eyebrow + title.
       Fixed 60mm so body flows naturally below without a giant black void.
       The brand-mark footer was removed for now — it had a PDFShift rendering
       glitch where the text overlapped itself. Will be re-added as a clean
       slate-meta element in a later iteration. -->
  <div class="page hero">
    <!-- LOGO_SVG_CONTENT is a complete svg from assets/logo-wordmark-light.svg.
         Wrapped in a div, not another svg, to avoid invalid nesting. -->
    <div class="header-logo">
      {{LOGO_SVG_CONTENT}}
    </div>
    <div class="document-content">
      {{HERO_CONTENT}}
    </div>
  </div>

  <!-- Body: paper-white, flows naturally. No min-height, so it ends at the
       natural bottom of its content. Multi-page bodies inherit paper background
       from body{} above. -->
  <div class="page paper">
    <div class="document-content">
      {{BODY_CONTENT}}
    </div>
  </div>
</body>
</html>
